<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCare - 개인 맞춤 약 처방 및 복용 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #f8fafc;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col pb-12">

  <!-- 1. 로그인 / 회원가입 화면 -->
  <div id="auth-section" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border border-slate-100 space-y-6">
      
      <div class="text-center space-y-2">
        <div class="w-14 h-14 bg-teal-600 text-white rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-teal-600/30">
          <i data-lucide="pill-bottle" class="w-8 h-8"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-900" id="auth-title">MediCare 로그인</h2>
        <p class="text-xs text-slate-500">개인 맞춤 약 처방 및 복용 관리 서비스</p>
      </div>

      <!-- 폼 영역 (사용자는 아이디/비밀번호만 입력) -->
      <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
        <div id="name-field" class="hidden">
          <label class="block text-xs font-semibold text-slate-600 mb-1">이름</label>
          <input type="text" id="auth-name" placeholder="홍길동" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-teal-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">아이디</label>
          <input type="text" id="auth-id" required placeholder="아이디 입력" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-teal-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호</label>
          <input type="password" id="auth-pw" required placeholder="비밀번호 입력" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-teal-500">
        </div>

        <button type="submit" id="auth-submit-btn" class="w-full py-3 bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-bold text-sm shadow-md transition active:scale-95">
          로그인
        </button>
      </form>

      <div class="text-center pt-2 border-t border-slate-100">
        <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-xs font-semibold text-teal-600 hover:underline">
          계정이 없으신가요? 회원가입하기
        </button>
      </div>

    </div>
  </div>

  <!-- 2. 메인 애플리케이션 화면 -->
  <div id="app-section" class="hidden flex-col min-h-screen">
    
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
      <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-teal-600 text-white flex items-center justify-center shadow-md shadow-teal-600/20">
            <i data-lucide="pill-bottle" class="w-6 h-6"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">MediCare</h1>
            <p class="text-xs text-slate-500"><span id="user-display-name" class="font-bold text-teal-700"></span>님의 복용 일정</p>
          </div>
        </div>
        
        <div class="flex items-center gap-2">
          <button onclick="openAddModal()" class="flex items-center gap-1.5 bg-teal-600 hover:bg-teal-700 text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition-all shadow-sm">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>새 처방약 추가</span>
          </button>
          <button onclick="logout()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-semibold transition">
            로그아웃
          </button>
        </div>
      </div>

      <!-- 🔊 음성 안내 바 -->
      <div class="bg-teal-900 text-white border-t border-teal-800">
        <div class="max-w-5xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-2 text-teal-100 font-medium text-xs">
            <i data-lucide="volume-2" class="w-4 h-4 text-teal-300"></i>
            <span>음성 안내</span>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <button onclick="speakTodaySummary()" class="flex items-center gap-1 bg-teal-600 hover:bg-teal-500 text-white px-3 py-1 rounded-lg text-xs font-bold border border-teal-400/30">
              <i data-lucide="play" class="w-3.5 h-3.5 fill-white"></i>
              <span>오늘 약 전체 읽기</span>
            </button>

            <div class="flex items-center bg-teal-800 rounded-lg p-0.5 border border-teal-700/50 text-xs">
              <span class="px-1.5 text-teal-300 text-[11px]">속도:</span>
              <button id="rate-0.7" onclick="setSpeechRate(0.7)" class="px-1.5 py-0.5 rounded text-teal-200 hover:text-white">느림</button>
              <button id="rate-1.0" onclick="setSpeechRate(1.0)" class="px-1.5 py-0.5 rounded bg-teal-600 text-white font-bold">보통</button>
              <button id="rate-1.3" onclick="setSpeechRate(1.3)" class="px-1.5 py-0.5 rounded text-teal-200 hover:text-white">빠름</button>
            </div>

            <button onclick="stopSpeech()" class="flex items-center gap-1 bg-rose-600 hover:bg-rose-500 text-white px-2.5 py-1 rounded-lg text-xs font-bold">
              <i data-lucide="square" class="w-3.5 h-3.5 fill-white"></i>
              <span>중지</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 pt-6 flex-1 w-full space-y-8">

      <!-- 1. 오늘 복용 체크리스트 (아침 -> 점심 -> 저녁 -> 취침전 순 정렬) -->
      <section class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <i data-lucide="calendar-check" class="w-5 h-5 text-teal-600"></i>
            <h2 class="text-base font-bold text-slate-900">오늘 복용할 약 (시간순)</h2>
            <span id="today-date" class="text-xs font-medium text-slate-500 bg-slate-100 px-2.5 py-0.5 rounded-full"></span>
          </div>
          <div class="text-xs font-semibold text-teal-700 bg-teal-50 px-3 py-1 rounded-full">
            달성률: <span id="completion-rate">0%</span>
          </div>
        </div>

        <div id="today-med-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
      </section>

      <!-- 2. 약물 내역 & 필터 -->
      <section class="space-y-4">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h2 class="text-base font-bold text-slate-900">내 처방약 목록</h2>
            <p class="text-xs text-slate-500">등록된 복용 약물의 상세 정보를 확인하세요.</p>
          </div>

          <div class="relative flex-1 sm:w-64">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="search-input" oninput="renderMedList()" placeholder="약 이름, 효능 검색..." class="w-full pl-9 pr-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-teal-500">
          </div>
        </div>

        <div id="med-card-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </section>

    </main>
  </div>

  <!-- 약 추가 모달 -->
  <div id="med-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-100 max-h-[90vh] overflow-y-auto space-y-4">
      <div class="flex items-center justify-between border-b pb-3 border-slate-100">
        <h3 id="modal-title" class="text-base font-bold text-slate-900">새 약 처방 등록</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="med-form" onsubmit="saveMedicine(event)" class="space-y-4">
        <input type="hidden" id="med-id">

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">약 이름 *</label>
          <input type="text" id="med-name" required placeholder="예: 타이레놀정 500mg" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs outline-none focus:ring-2 focus:ring-teal-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">약 형태/색상</label>
            <input type="text" id="med-shape" placeholder="예: 흰색 알약" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs outline-none focus:ring-2 focus:ring-teal-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">복용 기간</label>
            <input type="text" id="med-period" placeholder="예: 7일간" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs outline-none focus:ring-2 focus:ring-teal-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-2">복용 시간대 선택 *</label>
          <div class="grid grid-cols-4 gap-2">
            <label class="flex items-center gap-1.5 p-2 border border-slate-200 rounded-lg text-xs cursor-pointer hover:bg-slate-50">
              <input type="checkbox" name="timeSlot" value="아침" class="accent-teal-600">
              <span>아침</span>
            </label>
            <label class="flex items-center gap-1.5 p-2 border border-slate-200 rounded-lg text-xs cursor-pointer hover:bg-slate-50">
              <input type="checkbox" name="timeSlot" value="점심" class="accent-teal-600">
              <span>점심</span>
            </label>
            <label class="flex items-center gap-1.5 p-2 border border-slate-200 rounded-lg text-xs cursor-pointer hover:bg-slate-50">
              <input type="checkbox" name="timeSlot" value="저녁" class="accent-teal-600">
              <span>저녁</span>
            </label>
            <label class="flex items-center gap-1.5 p-2 border border-slate-200 rounded-lg text-xs cursor-pointer hover:bg-slate-50">
              <input type="checkbox" name="timeSlot" value="취침전" class="accent-teal-600">
              <span>취침전</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">약 효능 및 기능 (무슨 약인지)</label>
          <textarea id="med-desc" rows="2" placeholder="예: 두통 및 해열작용" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs outline-none focus:ring-2 focus:ring-teal-500"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-amber-700 mb-1 flex items-center gap-1">
            <i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i> 부작용 및 주의사항
          </label>
          <textarea id="med-sideeffects" rows="2" placeholder="예: 졸음 유발 가능, 음주 금지" class="w-full px-3 py-2 border border-amber-200 bg-amber-50/30 rounded-lg text-xs outline-none focus:ring-2 focus:ring-amber-500"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-medium text-slate-600 hover:bg-slate-100">취소</button>
          <button type="submit" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-semibold shadow-sm">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // =========================================================================
    // 🔑 개발자 전용 설정: 생성하신 구글 앱스크립트 URL을 아래에 넣어주세요!
    // =========================================================================
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwWa1HQ_Q-IMpOJqNPij52c5zcw_XLbPJJsvR9w--mJMHGVv1lxuKw7bnfBfpfcwdwg/exec";

    const TIME_ORDER = { '아침': 1, '점심': 2, '저녁': 3, '취침전': 4 };
    let isSignupMode = false;
    let currentUser = null;

    const DEFAULT_MEDS = [
      { id: 'm1', name: '아모디핀정 (혈압약)', shape: '노란색 알약', timeSlots: ['아침'], desc: '고혈압 치료제로 혈압을 낮춰줍니다.', sideEffects: '어지러움, 두통이 생길 수 있습니다.' },
      { id: 'm2', name: '글루코파지정 (당뇨약)', shape: '흰색 알약', timeSlots: ['아침', '저녁'], desc: '혈당 조절 치료제입니다.', sideEffects: '메스꺼움이 발생할 수 있으니 식후 바로 복용하세요.' },
      { id: 'm3', name: '마그밀정 (위장약)', shape: '흰색 알약', timeSlots: ['점심', '저녁'], desc: '위산 과다 속쓰림 완화제입니다.', sideEffects: '설사 증상이 나타날 수 있습니다.' }
    ];

    let medicines = [];
    let todayLogs = {};
    let speechRate = 1.0;

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('today-date').innerText = new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
      lucide.createIcons();
    });

    function toggleAuthMode() {
      isSignupMode = !isSignupMode;
      document.getElementById('name-field').classList.toggle('hidden', !isSignupMode);
      document.getElementById('auth-title').innerText = isSignupMode ? 'MediCare 회원가입' : 'MediCare 로그인';
      document.getElementById('auth-submit-btn').innerText = isSignupMode ? '회원가입' : '로그인';
      document.getElementById('auth-toggle-btn').innerText = isSignupMode ? '이미 계정이 있으신가요? 로그인' : '계정이 없으신가요? 회원가입하기';
    }

    async function handleAuth(e) {
      e.preventDefault();
      const id = document.getElementById('auth-id').value;
      const pw = document.getElementById('auth-pw').value;
      const name = document.getElementById('auth-name').value;

      // GOOGLE_SCRIPT_URL이 설정되어 있는 경우 백엔드 통신
      if (GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.includes('YOUR_SCRIPT_ID')) {
        try {
          const action = isSignupMode ? 'signup' : 'login';
          const res = await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action, id, password: pw, name })
          });
          const result = await res.json();

          if (result.result === 'success') {
            if (isSignupMode) {
              alert('회원가입이 완료되었습니다. 로그인 해주세요.');
              toggleAuthMode();
            } else {
              loginUser(result.name || id, id);
            }
          } else {
            alert(result.message || '인증에 실패했습니다.');
          }
        } catch (err) {
          alert('구글 시트 통신 중 오류가 발생했습니다.');
        }
      } else {
        // URL을 아직 안 적었을 때는 즉시 로컬 모드로 작동
        if (isSignupMode) {
          alert('회원가입 완료 (테스트 모드)');
          toggleAuthMode();
        } else {
          loginUser(name || id, id);
        }
      }
    }

    function loginUser(userName, userId) {
      currentUser = { name: userName, id: userId };
      document.getElementById('user-display-name').innerText = userName;

      medicines = JSON.parse(localStorage.getItem(`meds_${userId}`)) || DEFAULT_MEDS;
      todayLogs = JSON.parse(localStorage.getItem(`logs_${userId}`)) || {};

      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');
      document.getElementById('app-section').classList.add('flex');

      renderAll();
      speakText(`${userName}님 환영합니다. 오늘 복용 일정을 확인하세요.`);
    }

    function logout() {
      document.getElementById('auth-section').classList.remove('hidden');
      document.getElementById('app-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('flex');
      document.getElementById('auth-form').reset();
      stopSpeech();
    }

    function saveData() {
      if (currentUser) {
        localStorage.setItem(`meds_${currentUser.id}`, JSON.stringify(medicines));
        localStorage.setItem(`logs_${currentUser.id}`, JSON.stringify(todayLogs));
      }
    }

    function renderAll() {
      renderTodayList();
      renderMedList();
    }

    function renderTodayList() {
      const container = document.getElementById('today-med-list');
      container.innerHTML = '';

      let list = [];
      medicines.forEach(m => {
        m.timeSlots.forEach(s => list.push({ slot: s, order: TIME_ORDER[s] || 99, med: m }));
      });

      list.sort((a, b) => a.order - b.order);

      let doneCount = 0;

      list.forEach(item => {
        const key = `${item.med.id}_${item.slot}`;
        const isDone = !!todayLogs[key];
        if (isDone) doneCount++;

        const card = document.createElement('div');
        card.className = `p-3 rounded-xl border flex items-center justify-between transition-all ${isDone ? 'bg-slate-50 border-slate-200 text-slate-400' : 'bg-teal-50/40 border-teal-100 text-slate-800'}`;

        card.innerHTML = `
          <div class="flex items-center gap-2.5">
            <button onclick="toggleCheck('${key}')" class="w-5 h-5 rounded-md border flex items-center justify-center transition ${isDone ? 'bg-teal-600 border-teal-600 text-white' : 'border-slate-300 bg-white text-transparent hover:border-teal-500'}">
              <i data-lucide="check" class="w-3.5 h-3.5"></i>
            </button>
            <div>
              <div class="text-[11px] font-bold ${isDone ? 'text-teal-700 line-through' : 'text-teal-800'}">${item.slot} 복용</div>
              <div class="text-xs font-bold ${isDone ? 'line-through text-slate-400' : 'text-slate-800'}">${item.med.name}</div>
            </div>
          </div>
          <button onclick="speakText('${item.slot} 복용 약, ${item.med.name}입니다.')" class="p-1.5 text-slate-400 hover:text-teal-600 rounded-lg">
            <i data-lucide="volume-2" class="w-4 h-4"></i>
          </button>
        `;
        container.appendChild(card);
      });

      const rate = list.length === 0 ? 0 : Math.round((doneCount / list.length) * 100);
      document.getElementById('completion-rate').innerText = `${rate}% (${doneCount}/${list.length})`;
      lucide.createIcons();
    }

    function toggleCheck(key) {
      todayLogs[key] = !todayLogs[key];
      saveData();
      renderTodayList();
    }

    function renderMedList() {
      const container = document.getElementById('med-card-container');
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      container.innerHTML = '';

      const filtered = medicines.filter(m => m.name.toLowerCase().includes(query) || m.desc.toLowerCase().includes(query));

      filtered.forEach(med => {
        const sortedSlots = [...med.timeSlots].sort((a,b) => (TIME_ORDER[a]||99) - (TIME_ORDER[b]||99));
        const speakContent = `${med.name}. 복용시간 ${sortedSlots.join(', ')}. 약 설명: ${med.desc}. 주의사항: ${med.sideEffects}`;

        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl border border-slate-200 p-4 shadow-sm space-y-2 relative";
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2 border-b border-slate-100 pb-2">
            <div>
              <span class="text-[10px] font-bold text-teal-700 bg-teal-50 px-2 py-0.5 rounded-md">${med.shape || '알약'}</span>
              <h3 class="text-sm font-bold text-slate-900 mt-1">${med.name}</h3>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="speakText('${speakContent.replace(/'/g, "\\'")}')" class="px-2 py-1 bg-teal-50 text-teal-700 rounded-lg text-[11px] font-bold flex items-center gap-1">
                <i data-lucide="volume-2" class="w-3 h-3"></i> 낭독
              </button>
              <button onclick="deleteMed('${med.id}')" class="p-1 text-slate-400 hover:text-rose-600">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
          <div class="text-xs space-y-1.5 text-slate-600">
            <div class="flex gap-2">
              <span class="font-bold text-slate-400 w-14 shrink-0">복용시간</span>
              <div class="flex gap-1">${sortedSlots.map(s => `<span class="bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded text-[11px] font-semibold">${s}</span>`).join('')}</div>
            </div>
            <div class="flex gap-2">
              <span class="font-bold text-slate-400 w-14 shrink-0">약 정보</span>
              <p class="text-slate-800">${med.desc}</p>
            </div>
            <div class="bg-amber-50/70 p-2 rounded-lg border border-amber-100 text-amber-900 mt-1">
              <span class="font-bold text-[11px] text-amber-700 block">부작용 및 주의사항</span>
              <p class="text-[11px]">${med.sideEffects}</p>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    function openAddModal() {
      document.getElementById('med-form').reset();
      document.getElementById('med-id').value = '';
      document.getElementById('med-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('med-modal').classList.add('hidden');
    }

    function saveMedicine(e) {
      e.preventDefault();
      const id = document.getElementById('med-id').value || 'med-' + Date.now();
      const name = document.getElementById('med-name').value;
      const shape = document.getElementById('med-shape').value;
      const desc = document.getElementById('med-desc').value;
      const sideEffects = document.getElementById('med-sideeffects').value;
      const timeSlots = Array.from(document.querySelectorAll('input[name="timeSlot"]:checked')).map(cb => cb.value);

      if (timeSlots.length === 0) {
        alert('복용 시간대를 선택해주세요.');
        return;
      }

      const newMed = { id, name, shape, timeSlots, desc, sideEffects };
      const idx = medicines.findIndex(m => m.id === id);
      if (idx >= 0) medicines[idx] = newMed;
      else medicines.push(newMed);

      saveData();
      renderAll();
      closeModal();
      speakText(`${name} 약이 추가되었습니다.`);
    }

    function deleteMed(id) {
      if (confirm('삭제하시겠습니까?')) {
        medicines = medicines.filter(m => m.id !== id);
        saveData();
        renderAll();
      }
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = speechRate;
      window.speechSynthesis.speak(u);
    }

    function speakTodaySummary() {
      if (medicines.length === 0) {
        speakText('등록된 약이 없습니다.');
        return;
      }
      let list = [];
      medicines.forEach(m => m.timeSlots.forEach(s => list.push({ slot: s, order: TIME_ORDER[s] || 99, name: m.name })));
      list.sort((a,b) => a.order - b.order);

      let txt = '오늘 복용할 약 시간순 안내입니다. ';
      list.forEach(i => { txt += `${i.slot} 복용 약, ${i.name}. `; });
      speakText(txt);
    }

    function setSpeechRate(rate) {
      speechRate = rate;
      [0.7, 1.0, 1.3].forEach(r => {
        document.getElementById(`rate-${r}`).className = r === rate ? "px-1.5 py-0.5 rounded bg-teal-600 text-white font-bold" : "px-1.5 py-0.5 rounded text-teal-200 hover:text-white";
      });
      speakText(`음성 속도가 변경되었습니다.`);
    }

    function stopSpeech() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }
  </script>
</body>
</html>
